name = "buconero-dashboard-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Public app identifiers (not secrets)
[vars]
PLAY_PACKAGE_NAME = "com.gradeai.yourapp"
APPLE_BUNDLE_ID = "com.cardgradingai.app"

# Route: API on your domain (GitHub Pages serves the rest)
[[routes]]
pattern = "buconeroapps.com/api/*"
zone_name = "buconeroapps.com"

# Optional: Play Console financial reports bucket (pubsite_prod_rev_…)
# GOOGLE_PLAY_GCS_BUCKET = "pubsite_prod_rev_XXXXXXXXX"
#   npx wrangler secret put DASHBOARD_PASSWORD
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
#   npx wrangler secret put APPLE_KEY_ID
#   npx wrangler secret put APPLE_ISSUER_ID
#   npx wrangler secret put APPLE_PRIVATE_KEY
#   npx wrangler secret put APPLE_VENDOR_NUMBER
#   npx wrangler secret put ADMOB_ACCOUNT_ID
#   npx wrangler secret put ADMOB_CLIENT_ID
#   npx wrangler secret put ADMOB_CLIENT_SECRET
#   npx wrangler secret put ADMOB_REFRESH_TOKEN
# Optional:
#   npx wrangler secret put ADMOB_CURRENCY
